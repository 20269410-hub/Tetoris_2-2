<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>레트로 도트 테트리스 - No Duplicate Bag</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  body {
    background: #050505;
    color: white;
    text-align: center;
    font-family: 'Press Start 2P', cursive;
    font-size: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
    touch-action: none; 
  }

  .overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.95);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 20;
  }

  #startMenu { display: flex; }
  #gameOverScreen { display: none; }
  #helpScreen { display: none; }
  #pauseMenu { display: none; }

  .title-neon {
    font-size: 30px;
    color: #fff;
    text-shadow: 0 0 10px #00ccff, 0 0 20px #00ccff, 0 0 40px #00ccff;
    margin-bottom: 30px;
    line-height: 1.4;
  }

  .best-score {
    color: #f1c40f;
    margin-bottom: 40px;
    font-size: 12px;
    letter-spacing: 2px;
  }

  .menu-btn-group {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }

  .btn {
    background: #fff;
    color: #000;
    border: none;
    padding: 15px 30px;
    font-family: 'Press Start 2P', cursive;
    cursor: pointer;
    font-size: 12px;
    box-shadow: 4px 4px 0 #555;
    transition: 0.1s;
    width: 220px;
  }

  .btn:hover { background: #33FF00; box-shadow: 4px 4px 0 #006400; }
  .btn:active { transform: translate(2px, 2px); box-shadow: 0 0 0; }
  
  .btn.secondary { background: #444; color: #fff; }
  .btn.secondary:hover { background: #FF0033; box-shadow: 4px 4px 0 #8B0000; }

  .top-bar {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 330px;
    margin-bottom: 10px;
  }

  .pause-btn {
    background: transparent;
    border: 2px solid #555;
    color: white;
    font-family: 'Press Start 2P', cursive;
    font-size: 10px;
    padding: 5px 10px;
    cursor: pointer;
  }

  .game-container {
    position: relative;
    display: flex;
    gap: 15px;
    background: #111;
    padding: 10px;
    border: 4px solid #333;
  }

  canvas { background: #000; display: block; image-rendering: pixelated; }

  .side-panel { width: 100px; display: flex; flex-direction: column; gap: 10px; }
  .info-box { background: #000; padding: 10px; border: 2px solid #444; }
  .info-label { font-size: 8px; color: #aaa; margin-bottom: 8px; }
  .info-value { font-size: 14px; color: #fff; }
  
  .mobile-controls {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    justify-content: center;
    flex-wrap: wrap;
    max-width: 350px;
  }

  .m-btn {
    width: 50px;
    height: 50px;
    background: #222;
    border: 3px solid #555;
    color: white;
    font-size: 18px;
    border-radius: 10px;
    touch-action: none; 
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }

  .m-btn.active { background: #444; border-color: #33FF00; color: #33FF00; }
</style>
</head>
<body>

<div class="top-bar">
  <div></div>
  <button class="pause-btn" onclick="togglePause()">II PAUSE</button>
</div>

<div class="game-container">
  <div id="startMenu" class="overlay">
    <div class="title-neon">TETRIS<br>DOT</div>
    <div class="best-score">BEST: <span id="bestScore">0</span></div>
    <div class="menu-btn-group">
      <button class="btn" onclick="startGame()">START GAME</button>
      <button class="btn secondary" onclick="showHelp()">HOW TO PLAY</button>
    </div>
  </div>

  <div id="gameOverScreen" class="overlay">
    <h2 style="color: #ff0033; font-size: 20px;">GAME OVER</h2>
    <div id="finalScore" style="font-size: 18px; margin-bottom: 30px;">0</div>
    <button class="btn" onclick="startGame()">RETRY</button>
  </div>

  <div id="pauseMenu" class="overlay">
    <h2 style="color: #FFCC00; font-size: 20px;">PAUSED</h2>
    <button class="btn" onclick="togglePause()">RESUME</button>
    <button class="btn secondary" onclick="quitGame()">QUIT</button>
  </div>

  <div id="helpScreen" class="overlay">
    <h2 style="color: #33FF00;">CONTROLS</h2>
    <p style="line-height: 2;">← → : MOVE<br>↑ : ROTATE<br>↓ : SOFT DROP<br>C : HOLD</p>
    <button class="btn secondary" onclick="hideHelp()">BACK</button>
  </div>

  <canvas id="game" width="200" height="400"></canvas>

  <div class="side-panel">
    <div class="info-box">
      <div class="info-label">HOLD</div>
      <canvas id="holdCanvas" width="80" height="80"></canvas>
    </div>
    <div class="info-box">
      <div class="info-label">NEXT</div>
      <canvas id="nextCanvas" width="80" height="80"></canvas>
    </div>
    <div class="info-box">
      <div class="info-label">SCORE</div>
      <div id="score" class="info-value">0</div>
    </div>
  </div>
</div>

<div class="mobile-controls">
  <div class="m-btn" id="btn-hold">H</div>
  <div class="m-btn" id="btn-left">←</div>
  <div class="m-btn" id="btn-down">↓</div>
  <div class="m-btn" id="btn-right">→</div>
  <div class="m-btn" id="btn-rotate">↻</div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const nextCanvas = document.getElementById("nextCanvas");
const nextCtx = nextCanvas.getContext("2d");
const holdCanvas = document.getElementById("holdCanvas");
const holdCtx = holdCanvas.getContext("2d");

const scoreEl = document.getElementById("score");
const bestScoreEl = document.getElementById("bestScore");
const finalScoreEl = document.getElementById("finalScore");

const ROW = 20, COL = 10, SIZE = 20;
const COLORS = [null, '#FF0033', '#FFCC00', '#33FF00', '#9900FF', '#00CCFF'];

const tetrominoes = [
  { shape: [[1,1,1,1]], color: 1 },
  { shape: [[2,2],[2,2]], color: 2 },
  { shape: [[0,3,0],[3,3,3]], color: 3 },
  { shape: [[4,4,0],[0,4,4]], color: 4 },
  { shape: [[0,5,5],[5,5,0]], color: 5 }
];

let board, score, level, gameInterval, isPaused = true, isGameOver = false;
let piece, nextPiece, holdPiece = null, canHold = true;
let pieceBag = [];

// === 핵심: 가방 시스템 (중복 방지) ===
function shuffleBag() {
  // 0부터 블록 개수만큼 인덱스를 배열에 넣음 [0, 1, 2, 3, 4]
  let newBag = Array.from({length: tetrominoes.length}, (_, i) => i);
  // 피셔-예이츠 셔플
  for (let i = newBag.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [newBag[i], newBag[j]] = [newBag[j], newBag[i]];
  }
  return newBag;
}

function createPiece() {
  if (pieceBag.length === 0) {
    pieceBag = shuffleBag();
  }
  // 가방에서 하나를 꺼냄
  const index = pieceBag.pop();
  const p = tetrominoes[index];
  return { 
    shape: p.shape.map(row => [...row]), // 깊은 복사
    color: p.color, 
    x: Math.floor(COL/2) - Math.floor(p.shape[0].length/2), 
    y: 0 
  };
}

// === 게임 로직 ===
function startGame() {
  board = Array.from({length: ROW}, () => Array(COL).fill(0));
  score = 0; scoreEl.textContent = "0";
  pieceBag = [];
  holdPiece = null; canHold = true;
  isPaused = false; isGameOver = false;
  
  document.querySelectorAll('.overlay').forEach(el => el.style.display = 'none');
  
  piece = createPiece();
  nextPiece = createPiece();
  
  if (gameInterval) clearInterval(gameInterval);
  gameInterval = setInterval(drop, 500);
  draw(); drawNext(); drawHold();
}

function drawSquare(x, y, colorIndex, context, size = SIZE) {
  context.fillStyle = COLORS[colorIndex];
  context.fillRect(x * size, y * size, size, size);
  context.strokeStyle = "rgba(0,0,0,0.2)";
  context.strokeRect(x * size, y * size, size, size);
}

function draw() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  // Board
  for(let y=0; y<ROW; y++) {
    for(let x=0; x<COL; x++) {
      if(board[y][x]) drawSquare(x, y, board[y][x], ctx);
    }
  }
  
  // Current Piece
  if(piece) {
    piece.shape.forEach((row, dy) => {
      row.forEach((value, dx) => {
        if(value) drawSquare(piece.x + dx, piece.y + dy, piece.color, ctx);
      });
    });
  }
}

function drawMini(context, p, canvasObj) {
  context.fillStyle = "#000";
  context.fillRect(0, 0, canvasObj.width, canvasObj.height);
  if(!p) return;
  const s = 15;
  p.shape.forEach((row, dy) => {
    row.forEach((value, dx) => {
      if(value) drawSquare(dx + 1, dy + 1, p.color, context, s);
    });
  });
}

function drawNext() { drawMini(nextCtx, nextPiece, nextCanvas); }
function drawHold() { drawMini(holdCtx, holdPiece, holdCanvas); }

function collide(px, py, shape) {
  return shape.some((row, dy) => row.some((val, dx) => {
    let x = px + dx, y = py + dy;
    return val && (x < 0 || x >= COL || y >= ROW || (y >= 0 && board[y][x]));
  }));
}

function drop() {
  if(isPaused) return;
  if(!collide(piece.x, piece.y + 1, piece.shape)) {
    piece.y++;
  } else {
    piece.shape.forEach((row, dy) => {
      row.forEach((val, dx) => { if(val) board[piece.y+dy][piece.x+dx] = piece.color; });
    });
    clearLines();
    piece = nextPiece;
    nextPiece = createPiece();
    canHold = true;
    drawNext();
    if(collide(piece.x, piece.y, piece.shape)) {
      isGameOver = true; clearInterval(gameInterval);
      finalScoreEl.textContent = score;
      document.getElementById("gameOverScreen").style.display = "flex";
    }
  }
  draw();
}

function clearLines() {
  let lines = 0;
  for(let y=ROW-1; y>=0; y--) {
    if(board[y].every(v => v !== 0)) {
      board.splice(y, 1);
      board.unshift(Array(COL).fill(0));
      lines++; y++;
    }
  }
  if(lines) { score += lines * 100; scoreEl.textContent = score; }
}

function hold() {
  if(!canHold || isPaused) return;
  if(!holdPiece) {
    holdPiece = { shape: tetrominoes[piece.color-1].shape, color: piece.color };
    piece = nextPiece; nextPiece = createPiece();
  } else {
    let temp = { shape: tetrominoes[piece.color-1].shape, color: piece.color };
    piece = { shape: holdPiece.shape, color: holdPiece.color, x: 3, y: 0 };
    holdPiece = temp;
  }
  canHold = false; drawHold(); drawNext(); draw();
}

function rotate() {
  let r = piece.shape[0].map((_, i) => piece.shape.map(row => row[i]).reverse());
  if(!collide(piece.x, piece.y, r)) piece.shape = r;
  draw();
}

// === 컨트롤 설정 ===
function showHelp() { document.getElementById("helpScreen").style.display = "flex"; }
function hideHelp() { document.getElementById("helpScreen").style.display = "none"; }
function togglePause() { 
  isPaused = !isPaused; 
  document.getElementById("pauseMenu").style.display = isPaused ? "flex" : "none";
}
function quitGame() { location.reload(); }

document.addEventListener("keydown", e => {
  if(isPaused && e.key !== "Escape") return;
  if(e.key === "ArrowLeft" && !collide(piece.x-1, piece.y, piece.shape)) piece.x--;
  if(e.key === "ArrowRight" && !collide(piece.x+1, piece.y, piece.shape)) piece.x++;
  if(e.key === "ArrowDown") drop();
  if(e.key === "ArrowUp") rotate();
  if(e.key.toLowerCase() === "c") hold();
  if(e.key === "Escape") togglePause();
  draw();
});

// Mobile Buttons
document.getElementById("btn-left").onclick = () => { if(!isPaused && !collide(piece.x-1, piece.y, piece.shape)) piece.x--; draw(); };
document.getElementById("btn-right").onclick = () => { if(!isPaused && !collide(piece.x+1, piece.y, piece.shape)) piece.x++; draw(); };
document.getElementById("btn-rotate").onclick = () => { if(!isPaused) rotate(); };
document.getElementById("btn-down").onclick = () => { if(!isPaused) drop(); };
document.getElementById("btn-hold").onclick = () => { if(!isPaused) hold(); };

</script>
</body>
</html>
